<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <link rel="stylesheet" href="../shared/glass.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>Pomodoro Jinshi</title>
  </head>
  <body>
    <section class="panel" aria-label="Pomodoro Jinshi">
      <div class="illustration">
        <svg class="dial" id="duration-slider" viewBox="0 0 160 160" role="slider"
          aria-label="Durasi sesi dalam menit" aria-valuemin="1" aria-valuemax="90"
          aria-valuenow="25" tabindex="0">
          <circle class="ring-track" cx="80" cy="80" r="69" />
          <circle class="ring-progress" id="progress-ring" cx="80" cy="80" r="69" pathLength="100" />
          <circle class="ring-dot" id="progress-dot" cx="80" cy="11" r="7" />
        </svg>
        <img class="pet" src="../pet/assets/frames/idle-blink/01.png" alt="" aria-hidden="true" />
      </div>
      <div class="glass time" id="time" role="timer" aria-label="Fokus 25:00" aria-live="off">25:00</div>
      <div class="actions">
        <button type="button" id="start" class="glass primary">Mulai</button>
        <button type="button" id="pause" class="glass" disabled>Pause</button>
        <button type="button" id="reset" class="glass">Ulang</button>
      </div>
    </section>
    <script src="./pomodoro.js"></script>
  </body>
</html>
