<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <link rel="stylesheet" href="../shared/glass.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>Acara baru</title>
  </head>

  <body>
    <main class="glass panel" aria-label="Acara Calendar">
      <header class="header">
        <span class="header__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3.5" y="5" width="17" height="15.5" rx="3" />
            <path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17" />
            <path d="m9 15 2 2 4-4" />
          </svg>
        </span>
        <h1 id="heading">Acara baru</h1>
        <button type="button" class="close" id="close" aria-label="Tutup panel">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" /></svg>
        </button>
      </header>

      <form id="form">
        <label class="field field--title">
          <span>Judul acara</span>
          <input id="title" type="text" placeholder="Mau ngapain?" autocomplete="off" maxlength="120" required />
        </label>

        <div class="row">
          <label class="field">
            <span>Tanggal</span>
            <input id="date" type="date" required />
          </label>
          <label class="field">
            <span>Mulai</span>
            <input id="start-time" type="time" required />
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span>Durasi</span>
            <span class="unit-input">
              <input id="duration" type="number" min="5" step="5" value="60" required />
              <span>menit</span>
            </span>
          </label>
          <label class="field">
            <span>Kalender</span>
            <select id="calendar">
              <option value="">Default</option>
            </select>
          </label>
        </div>

        <button type="submit" class="submit" id="submit">Simpan acara</button>
        <p class="status" id="status" role="status" aria-live="polite" hidden></p>
      </form>

      <section class="schedule" id="schedule" aria-label="Jadwal yang dibuat" tabindex="-1" hidden>
        <div class="schedule__main">
          <div class="date-tile" aria-hidden="true">
            <strong id="schedule-day">25</strong>
            <span id="schedule-month">SEP</span>
          </div>
          <div class="schedule__details">
            <h2 id="schedule-title"></h2>
            <p id="schedule-date"></p>
          </div>
        </div>
        <div class="schedule__line">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="10" cy="10" r="7" /><path d="M10 6v4l2.5 1.5" />
          </svg>
          <span id="schedule-time"></span>
          <span class="schedule__duration" id="schedule-duration"></span>
        </div>
        <div class="schedule__line">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="3" y="4" width="14" height="13" rx="2.5" /><path d="M6.5 2.5v3M13.5 2.5v3M3 8h14" />
          </svg>
          <span id="schedule-calendar"></span>
        </div>
        <button type="button" class="done" id="done">Selesai</button>
      </section>

      <div class="mascot-note" id="mascot-note" aria-hidden="true">
        <svg class="mascot-note__sparkle" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 1.5 11.8 8.2 18.5 10l-6.7 1.8L10 18.5l-1.8-6.7L1.5 10l6.7-1.8L10 1.5Z" />
        </svg>
        <span id="mascot-note-text">Jinshi siap mencatat</span>
        <span class="mascot-note__sticker">
          <img src="../pet/assets/frames/idle-blink/02.png" alt="" />
        </span>
      </div>
    </main>

    <script src="./calendar-event.js"></script>
  </body>
</html>
