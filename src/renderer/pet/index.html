<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:;"
    />

    <link rel="stylesheet" href="./style.css" />

    <title>Desktop Pet</title>
  </head>

  <body>
    <div id="stage" class="stage">
      <div id="bubble" class="bubble" hidden>
        <p id="bubble-text" class="bubble__text"></p>
        <span class="bubble__tail"></span>
      </div>

      <div id="pet" class="pet">
        <img
          id="pet-sprite"
          src="./assets/frames/idle-blink/01.png"
          alt="Desktop Pet"
          draggable="false"
        />
      </div>
    </div>

    <script src="./animation-data.js"></script>
    <script src="./animation.js"></script>
    <script src="./dialogue.js"></script>
    <script src="./bubble.js"></script>
    <script src="./passthrough.js"></script>
    <script src="./behavior.js"></script>
    <script src="./drag.js"></script>
    <script src="./pat.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
